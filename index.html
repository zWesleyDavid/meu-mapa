<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Meu Mapa</title>
  <meta name="description" content="Meu próprio app de mapas e rotas" />
  <meta name="theme-color" content="#101317" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#EEF2F5" media="(prefers-color-scheme: light)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Barlow+Condensed:wght@600;700;800&display=swap" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="map" aria-label="Mapa"></div>

  <!-- Coluna de painéis: no celular os filhos ficam soltos; no desktop vira a coluna da esquerda -->
  <div class="panel-col">
    <!-- Busca + categorias -->
    <header class="topbar" id="topbar">
      <form class="searchbox" id="search-form" autocomplete="off" role="search">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <label for="search-input" class="sr-only">Buscar</label>
        <input id="search-input" type="search" placeholder="Buscar um lugar ou endereço" enterkeyhint="search" />
        <button type="button" id="search-clear" class="icon-btn" aria-label="Limpar busca" hidden>
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
        <button type="button" id="settings-btn" class="square-btn" aria-label="Ajustes"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg></button>
      </form>
      <div class="chips" id="chips"></div>
      <ul id="search-results" class="results" role="listbox" hidden></ul>
    </header>

    <!-- Placa DE/PARA + modos (só no modo rotas) -->
    <div class="route-top" id="route-top" hidden></div>

    <!-- Painel: bottom sheet no celular, card na coluna no desktop -->
    <section id="sheet" class="sheet" data-state="hidden" aria-live="polite">
      <div class="sheet-handle" id="sheet-handle" aria-hidden="true"><span></span></div>
      <div class="sheet-body" id="sheet-body"></div>
    </section>
  </div>

  <!-- Botões flutuantes do mapa -->
  <div class="map-fabs" id="map-fabs">
    <button class="fab" id="btn-compass" aria-label="Apontar para o norte" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M12 3l4 9h-8z"/><path d="M12 21l-4-9h8z"/></svg>
    </button>
    <button class="fab fab-txt" id="btn-3d" aria-label="Mapa em 3D">3D</button>
    <button class="fab accent" id="btn-locate" aria-label="Minha localização">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
    </button>
  </div>

  <!-- Modo navegação -->
  <div id="nav" class="nav" hidden></div>

  <!-- Menu de contexto (toque longo / clique direito) -->
  <div id="ctx-menu" class="ctx-menu" hidden>
    <div class="ctx-title" id="ctx-title">Ponto no mapa</div>
    <button data-action="to">Rotas até aqui</button>
    <button data-action="from">Sair daqui</button>
    <button data-action="stop" hidden>Adicionar como parada</button>
    <button data-action="info">O que tem aqui?</button>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
